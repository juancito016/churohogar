<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Página no encontrada | Churo Hogar</title>
    <style>
        :root {
            --guinda: #630d16;
            --guinda-dark: #3c0811;
            --crema: #faf7f2;
            --arena: #e5d9c5;
            --tinta: #1a1a1a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--crema);
            color: var(--tinta);
            font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }
        .code {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(96px, 22vw, 150px);
            line-height: 1;
            font-style: italic;
            color: var(--guinda);
        }
        h1 {
            margin: 8px 0 0;
            font-size: clamp(20px, 4vw, 28px);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        p {
            margin: 16px auto 0;
            max-width: 420px;
            color: #6b6258;
            line-height: 1.6;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
            min-height: 48px;
            padding: 0 32px;
            border-radius: 999px;
            background: var(--guinda-dark);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        a:hover { background: #000; }
        .brand {
            margin-bottom: 24px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 14px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--guinda);
        }
        .brand span { color: #a98953; }
        .line {
            width: 56px;
            height: 2px;
            margin: 24px auto 0;
            background: var(--arena);
        }
    </style>
</head>
<body>
    <main>
        <p class="brand">Churo <span>Hogar</span></p>
        <p class="code">404</p>
        <h1>Página no encontrada</h1>
        <p>La página que buscas no existe o fue movida. Vuelve al inicio para seguir explorando propiedades en Tarija y Bolivia.</p>
        <div class="line"></div>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
